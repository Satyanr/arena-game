<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orb Arena — Custom Auto Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="top">
        <div>
          <h1>⚔ Orb Arena</h1>
          <p>Random Bounce • Custom Characters & Abilities</p>
        </div>
        <span id="round">Battle #1</span>
      </div>

      <canvas id="arena" class="arena"
              width="720" height="600"></canvas>

      <div class="status" id="status">Ready to fight</div>

      <div class="buttons">
        <button class="primary" id="start">▶ Start / Resume</button>
        <button id="pause">⏸ Pause</button>
        <button id="reset">↻ Restart</button>
        <button id="random">🎲 Randomize</button>
        <button id="save">💾 Save</button>
        <button id="export">⬇ Export JSON</button>
        <label class="filelabel">
          ⬆ Import JSON
          <input type="file" id="import" accept=".json,application/json">
        </label>
      </div>

      <p class="note">
        Perubahan statistik diterapkan saat Restart.
        Setiap pertandingan memiliki posisi, arah, dan
        pola pantulan berbeda.
      </p>
    </section>

    <section class="panel">
      <h2>Character & Ability Editor</h2>
      <div class="editors" id="editors"></div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
