<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orb Arena — Custom Auto Battle</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#e9eefb;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:22px}h1{margin:0;font-size:27px}p{color:#aeb9d3}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:18px;max-width:1350px;margin:auto}.panel{background:#151e34;border:1px solid #2b3b59;border-radius:16px;padding:16px}.arena{width:100%;aspect-ratio:1.2;display:block;background:#f7f9ff;border-radius:10px;touch-action:none}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,.filelabel{border:0;background:#364b77;color:white;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:650}button.primary{background:#496fe9}button:hover,.filelabel:hover{filter:brightness(1.2)}.editors{display:grid;grid-template-columns:1fr 1fr;gap:12px}h3{margin:5px 0 12px}label{display:block;font-size:12px;color:#b9c8e5;margin:9px 0 3px}input,select{width:100%;background:#0c1529;color:#f0f4ff;border:1px solid #364a6a;border-radius:7px;padding:8px}input[type=color]{padding:2px;height:36px}input[type=checkbox]{width:auto}.status{margin:12px 0;font-weight:700;text-align:center}.note{font-size:12px}.filelabel input{display:none}@media(max-width:850px){body{padding:10px}.layout{grid-template-columns:1fr}.editors{grid-template-columns:1fr 1fr}}@media(max-width:450px){.editors{grid-template-columns:1fr}}</style></head><body><main class="layout"><section class="panel"><div class="top"><div><h1>⚔ Orb Arena</h1><p>Physics Auto Battle • Custom Characters & Abilities</p></div><span id="round">Battle #1</span></div><canvas id="arena" class="arena" width="720" height="600"></canvas><div class="status" id="status">Ready to fight</div><div class="buttons"><button class="primary" id="start">▶ Start / Resume</button><button id="pause">⏸ Pause</button><button id="reset">↻ Restart</button><button id="random">🎲 Randomize</button><button id="save">💾 Save</button><button id="export">⬇ Export JSON</button><label class="filelabel">⬆ Import JSON<input type="file" id="import" accept="application/json,.json"></label></div><p class="note">Perubahan statistik diterapkan saat Restart. Save menyimpan pengaturan di browser. Export JSON untuk berbagi karakter.</p></section><section class="panel"><h2>Character & Ability Editor</h2><div class="editors" id="editors"></div></section></main><script>
'use strict';const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,TAU=Math.PI*2;const defaults=[{name:'Club',color:'#c65b38',weapon:'club',hp:100,speed:140,damage:3,attackSpeed:4,range:58,stun:.24,knockback:125,ability:'burn',chance:20},{name:'Dagger',color:'#29dd51',weapon:'dagger',hp:100,speed:160,damage:2,attackSpeed:7,range:49,stun:.10,knockback:85,ability:'heal',chance:14}];let config=JSON.parse(JSON.stringify(defaults)),fighters=[],running=false,finished=false,round=1,last=0,particles=[],clock=0;try{let saved=JSON.parse(localStorage.getItem('orbArenaConfig'));if(valid(saved))config=saved}catch{}const fields=[['name','Name','text'],['color','Color','color'],['weapon','Weapon','select',['club','dagger','sword','hammer','spear']],['hp','Max HP','number',10,1000],['speed','Movement speed','number',0,400],['damage','Damage','number',0,100],['attackSpeed','Attack speed (hits/sec)','number',.2,20],['range','Weapon reach','number',20,160],['stun','Stun duration (sec)','number',0,3],['knockback','Knockback','number',0,600],['ability','Special ability','select',['none','burn','poison','heal','shield','lifesteal','slow']],['chance','Ability chance (%)','number',0,100]];const editors=document.getElementById('editors');function valid(v){return Array.isArray(v)&&v.length===2&&v.every(c=>c&&typeof c.name==='string'&&/^#[0-9a-f]{6}$/i.test(c.color)&&['club','dagger','sword','hammer','spear'].includes(c.weapon)&&fields.filter(f=>f[2]==='number').every(f=>Number.isFinite(+c[f[0]])&&+c[f[0]]>=f[3]&&+c[f[0]]<=f[4])&&['none','burn','poison','heal','shield','lifesteal','slow'].includes(c.ability))}function renderEditor(){editors.innerHTML='';config.forEach((c,i)=>{let col=document.createElement('div');let h=document.createElement('h3');h.textContent=i?'🟢 Fighter B':'🟠 Fighter A';col.append(h);fields.forEach(([key,title,type,a,b])=>{let l=document.createElement('label');l.textContent=title;let el;if(type==='select'){el=document.createElement('select');a.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;el.append(o)})}else{el=document.createElement('input');el.type=type;if(type==='number'){el.min=a;el.max=b;el.step=['stun','attackSpeed'].includes(key)?'.01':'1'}}el.value=c[key];el.addEventListener('change',()=>{let v=type==='number'?Number(el.value):el.value;if(type==='number')v=Math.min(b,Math.max(a,Number.isFinite(v)?v:a));config[i][key]=v;el.value=v});l.append(el);col.append(l)});editors.append(col)})}function reset(){fighters=config.map((c,i)=>({...structuredClone(c),x:i?W-150:150,y:i?H-160:160,vx:i?-70:70,vy:i?55:-55,r:21,health:c.hp,angle:i?Math.PI:0,spin:i?-1:1,hitTimer:0,stunned:0,shield:0,dots:[],slow:0}));particles=[];finished=false;running=false;clock=0;document.getElementById('status').textContent='Ready to fight';document.getElementById('round').textContent='Battle #'+round;draw()}function effect(a,b){if(Math.random()*100>a.chance)return;switch(a.ability){case 'burn':b.dots.push({time:2,dps:Math.max(.5,a.damage*.7),color:'#f97316'});break;case 'poison':b.dots.push({time:3,dps:Math.max(.4,a.damage*.4),color:'#a855f7'});break;case 'heal':a.health=Math.min(a.hp,a.health+a.damage*1.6+2);break;case 'shield':a.shield=Math.min(40,a.shield+5+a.damage);break;case 'lifesteal':a.health=Math.min(a.hp,a.health+a.damage*.8);break;case 'slow':b.slow=Math.max(b.slow,1.6);break}}function hit(a,b){if(a.hitTimer>0||a.stunned>0||b.health<=0)return;let wx=a.x+Math.cos(a.angle)*a.range,wy=a.y+Math.sin(a.angle)*a.range;let dx=b.x-wx,dy=b.y-wy;if(dx*dx+dy*dy>(b.r+18)**2)return;let damage=Math.max(0,a.damage);let absorbed=Math.min(b.shield,damage);b.shield-=absorbed;b.health=Math.max(0,b.health-damage+absorbed);let d=Math.hypot(b.x-a.x,b.y-a.y)||1;b.vx+=(b.x-a.x)/d*a.knockback;b.vy+=(b.y-a.y)/d*a.knockback;b.stunned=Math.max(b.stunned,a.stun);a.hitTimer=1/Math.max(.2,a.attackSpeed);effect(a,b);particles.push({x:b.x,y:b.y,text:'-'+Math.round(damage-absorbed),life:.65,color:'#ef4444'});if(b.health<=0){finished=true;running=false;document.getElementById('status').textContent=a.name+' WINS! 🏆'}}function update(dt){clock+=dt;fighters.forEach((a,i)=>{let b=fighters[1-i];a.hitTimer=Math.max(0,a.hitTimer-dt);a.stunned=Math.max(0,a.stunned-dt);a.slow=Math.max(0,a.slow-dt);a.dots=a.dots.filter(dot=>{a.health=Math.max(0,a.health-dot.dps*dt);dot.time-=dt;return dot.time>0});if(a.health<=0&&!finished){finished=true;running=false;document.getElementById('status').textContent=b.name+' WINS! 🏆'}if(a.stunned>0)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;let accel=a.speed*(a.slow>0?.35:1);let seek=d>75?1:-.4;a.vx+=dx/d*accel*seek*dt*2;a.vy+=dy/d*accel*seek*dt*2;let drag=Math.exp(-1.2*dt);a.vx*=drag;a.vy*=drag;let vel=Math.hypot(a.vx,a.vy),max=a.speed*1.7;if(vel>max){a.vx*=max/vel;a.vy*=max/vel}a.x+=a.vx*dt;a.y+=a.vy*dt;for(let [p,v] of [['x','vx'],['y','vy']]){let edge=p==='x'?W:H;if(a[p]<a.r){a[p]=a.r;a[v]=Math.abs(a[v])*.85}else if(a[p]>edge-a.r){a[p]=edge-a.r;a[v]=-Math.abs(a[v])*.85}}a.angle+=a.spin*TAU*a.attackSpeed*dt*.34});let a=fighters[0],b=fighters[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<a.r+b.r){let overlap=(a.r+b.r-d)/2;a.x-=dx/d*overlap;a.y-=dy/d*overlap;b.x+=dx/d*overlap;b.y+=dy/d*overlap;let nx=dx/d,ny=dy/d,rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-rel*.8;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}}hit(a,b);if(!finished)hit(b,a);particles.forEach(p=>{p.y-=25*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}function weapon(a){let x=a.x+Math.cos(a.angle)*a.range,y=a.y+Math.sin(a.angle)*a.range;ctx.save();ctx.translate(x,y);ctx.rotate(a.angle);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1e293b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-a.range*.45,0);ctx.lineTo(5,0);ctx.stroke();if(a.weapon==='club'||a.weapon==='hammer'){ctx.fillStyle=a.weapon==='club'?'#65394a':'#64748b';ctx.fillRect(0,-(a.weapon==='club'?8:14),a.weapon==='club'?23:20,a.weapon==='club'?16:28)}else{ctx.fillStyle='#dbeafe';ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(a.weapon==='spear'?36:a.weapon==='sword'?29:19,0);ctx.lineTo(0,8);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1e293b';ctx.lineWidth=5;ctx.strokeRect(2.5,2.5,W-5,H-5);ctx.font='bold 18px system-ui';fighters.forEach((a,i)=>{weapon(a);ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,TAU);ctx.fillStyle=a.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#334155';ctx.stroke();if(a.shield>0){ctx.beginPath();ctx.arc(a.x,a.y,a.r+5,0,TAU);ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.stroke()}ctx.textAlign='center';ctx.fillStyle='#111827';ctx.font='bold 14px system-ui';ctx.fillText(Math.ceil(a.health),a.x,a.y+5);let sx=i?W-225:15;ctx.fillStyle='#111827';ctx.font='bold 18px system-ui';ctx.textAlign='left';ctx.fillText(a.name.slice(0,17),sx,28);ctx.fillStyle='#cbd5e1';ctx.fillRect(sx,36,210,13);ctx.fillStyle=a.color;ctx.fillRect(sx,36,210*Math.max(0,a.health/a.hp),13);ctx.fillStyle='#334155';ctx.font='12px system-ui';ctx.fillText(`${Math.ceil(a.health)}/${a.hp} HP · ${a.ability}`,sx,65)});particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y)});ctx.globalAlpha=1}function frame(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.035);last=t;if(running&&!finished){for(let i=0;i<2;i++)update(dt/2)}draw();requestAnimationFrame(frame)}document.getElementById('start').onclick=()=>{if(finished){round++;reset()}running=true;document.getElementById('status').textContent='⚔ Battle in progress'};document.getElementById('pause').onclick=()=>{running=false;document.getElementById('status').textContent='Paused'};document.getElementById('reset').onclick=()=>{round++;reset()};document.getElementById('random').onclick=()=>{config.forEach(c=>{c.damage=Math.round((1+Math.random()*9)*10)/10;c.attackSpeed=Math.round((2+Math.random()*9)*10)/10;c.stun=Math.round(Math.random()*7)/10;c.speed=Math.round(80+Math.random()*170);c.weapon=['club','dagger','sword','hammer','spear'][Math.floor(Math.random()*5)];c.ability=['burn','poison','heal','shield','lifesteal','slow'][Math.floor(Math.random()*6)]});renderEditor();reset()};document.getElementById('save').onclick=()=>{localStorage.setItem('orbArenaConfig',JSON.stringify(config));document.getElementById('status').textContent='Settings saved locally'};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='orb-arena-characters.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!valid(data))throw Error('Invalid character data');config=data;renderEditor();reset()}catch(err){alert('Import failed: '+err.message)}e.target.value=''};renderEditor();reset();requestAnimationFrame(frame);
</script></body></html>
